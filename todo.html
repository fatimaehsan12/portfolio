<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>To-Do App</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
  padding: 40px;
}

input {
  padding: 10px;
  width: 250px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px 15px;
  background: #38bdf8;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

ul {
  list-style: none;
  padding: 0;
  margin-top: 20px;
}

li {
  background: #1e293b;
  margin: 8px auto;
  padding: 10px;
  width: 300px;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
}

.delete {
  background: red;
  border: none;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>To-Do App</h1>

<input id="task" placeholder="Enter task">
<button onclick="addTask()">Add</button>

<ul id="list"></ul>

<script>
function addTask(){
  let task = document.getElementById("task").value;

  if(task === ""){
    alert("Enter a task!");
    return;
  }

  let li = document.createElement("li");
  li.innerHTML = task + " <button class='delete' onclick='removeTask(this)'>X</button>";

  document.getElementById("list").appendChild(li);
  document.getElementById("task").value = "";
}

function removeTask(btn){
  btn.parentElement.remove();
}
</script>

</body>
</html>
